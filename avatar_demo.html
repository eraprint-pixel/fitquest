<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аватар бойца — проверка</title>
<style>
@font-face { font-family: "Russo One"; src: url(fonts/russo-one-cyrillic.woff2) format("woff2");
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; font-display: swap; }
@font-face { font-family: "Russo One"; src: url(fonts/russo-one-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F; font-display: swap; }
:root { --bg: #0f0f12; --card: #17161a; --card2: #211f24; --line: #2e2b30;
  --gold: #d4b47a; --gold2: #f3dcaa; --fire: #ff783c; --text: #f1ece3; --muted: #9a958d;
  --disp: "Russo One", -apple-system, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, "SF Pro Text", "Segoe UI", Roboto, "PT Sans", sans-serif; }
.wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font: 18px var(--disp); letter-spacing: .18em; color: var(--gold2); margin: 4px 0 2px; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
#hero { width: 100%; max-width: 300px; aspect-ratio: 3 / 4; margin: 0 auto; }
.rank { text-align: center; font: 17px var(--disp); color: var(--gold2); margin-top: 4px; }
.stage { text-align: center; color: var(--muted); font-size: 13px; }
.bar { height: 10px; background: var(--card2); border-radius: 6px; overflow: hidden; margin: 10px 0 4px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b8955a, var(--gold2)); transition: width .6s; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row.c { justify-content: center; }
button { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; cursor: pointer; flex: 1 1 auto; }
button.gold { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1408; border: 0; font-weight: 600; }
button.fire { background: linear-gradient(180deg, #ff9a63, var(--fire)); color: #1a0d06; border: 0; font-weight: 600; }
button:active { transform: translateY(1px); }
.small { font-size: 12px; color: var(--muted); }
.day { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.day .bar { flex: 1; height: 6px; margin: 0; }
.day .bar i { background: linear-gradient(90deg, #a05a2c, var(--fire)); }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 90px; }
input, select { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
input[type=range] { padding: 0; accent-color: var(--gold); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 8px 10px; }
.seg button.on { background: var(--gold); color: #1a1408; }
.thumbs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.thumbs > div { min-width: 0; }
.thumbs > div > div { aspect-ratio: 3 / 4; overflow: hidden; }
@media (max-width: 480px) { .thumbs { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 10px; } }
.thumbs span { display: block; text-align: center; font-size: 11px; color: var(--muted); }
.log { font-size: 12px; color: var(--muted); min-height: 1.4em; text-align: center; margin-top: 6px; }
.log b { color: var(--gold2); font-weight: 600; }
.priv { text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>АВАТАР БОЙЦА</h1>
  <div class="sub">Проверочная страница модуля avatar.js</div>

  <div class="card">
    <div id="hero"></div>
    <div class="rank" id="rank"></div>
    <div class="stage" id="stage"></div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="day"><span>Отдача дня</span><div class="bar"><i id="dbar"></i></div><span id="dtxt"></span></div>
    <div class="log" id="log"></div>
  </div>

  <div class="card">
    <div class="row">
      <button class="gold" data-ev="workout">+ тренировка</button>
      <button class="gold" data-ev="order">+ приказ</button>
      <button class="fire" data-ev="boss">+ босс</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="nextDay">Следующий день ▸</button>
      <button id="sim7">+7 дней (трен. + приказ)</button>
      <button id="reset">Сброс</button>
    </div>
    <label style="margin-top:12px">Прогресс (просмотр): <span id="pval"></span>
      <input type="range" id="slider" min="0" max="100" step="1" value="0">
    </label>
  </div>

  <div class="card">
    <div class="row" style="align-items:flex-end">
      <label>Пол
        <div class="seg" id="sex"><button data-v="m">Муж</button><button data-v="f">Жен</button></div>
      </label>
      <label>Рост, см <input id="h" type="number" inputmode="numeric" min="130" max="215"></label>
      <label>Вес, кг <input id="w" type="number" inputmode="decimal" min="35" max="250"></label>
      <label>Цель, кг <input id="g" type="number" inputmode="decimal" min="35" max="250"></label>
    </div>
    <div class="row" style="margin-top:10px; align-items:flex-end">
      <label>Звание (экипировка)
        <select id="lvl"><option value="">Авто — по прогрессу</option></select>
      </label>
      <label>Тон кожи
        <select id="skin"><option value="0">Светлый</option><option value="1">Средний</option><option value="2">Смуглый</option><option value="3">Тёмный</option></select>
      </label>
      <button class="gold" id="apply" style="flex:0 0 auto">Создать заново</button>
    </div>
    <div class="small" style="margin-top:8px">Вес задаёт только стартовую фигуру и цель. Дальше аватар меняется за действия, а не за цифру на весах.</div>
  </div>

  <div class="card">
    <div class="small" style="margin-bottom:6px">Стадии пути 0 → 100%</div>
    <div class="thumbs" id="thumbs"></div>
  </div>
  <div class="priv">🔒 Аватар личный: по умолчанию его видишь только ты.</div>
</div>

<script src="avatar.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'kodtela.avatar.demo.v1';
  var DAY = 86400000;
  var $ = function (id) { return document.getElementById(id); };
  var data = load() || { state: null, dayOffset: 0 };
  if (!data.state) data.state = Avatar.create({ sex: 'm', height_cm: 175, weight_kg: 95, goal_kg: 80 });
  var hero = $('hero'), sexV = data.state.sex;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function now() { return Date.now() + data.dayOffset * DAY; }

  for (var i = 1; i <= 15; i++) {
    var o = document.createElement('option'); o.value = i; o.textContent = i + '. ' + Avatar.RANKS[i - 1]; $('lvl').appendChild(o);
  }

  function fillForm() {
    var s = data.state; sexV = s.sex;
    $('h').value = s.height_cm; $('w').value = s.weight_kg; $('g').value = s.goal_kg;
    $('lvl').value = s.level || ''; $('skin').value = s.skin || 0;
    [].forEach.call($('sex').children, function (b) { b.classList.toggle('on', b.dataset.v === sexV); });
  }

  function info(msg) {
    var st = Avatar.stage(data.state), td = Avatar.today(data.state, now());
    $('rank').textContent = st.level + '. ' + st.rank;
    $('stage').textContent = 'Стадия ' + st.index + ' из 5 — «' + st.name + '» · ' + Math.round(st.progress * 1000) / 10 + '%';
    $('pbar').style.width = (st.progress * 100) + '%';
    $('dbar').style.width = (td.saturation * 100) + '%';
    var d = new Date(now());
    $('dtxt').textContent = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + (data.dayOffset ? ' (+' + data.dayOffset + ' дн.)' : '');
    $('slider').value = Math.round(st.progress * 100); $('pval').textContent = Math.round(st.progress * 100) + '%';
    if (msg != null) $('log').innerHTML = msg;
  }

  function thumbs() {
    var box = $('thumbs'); box.innerHTML = '';
    [0, 0.2, 0.4, 0.6, 0.8, 1].forEach(function (p) {
      var w = document.createElement('div'), d = document.createElement('div'), sp = document.createElement('span');
      w.appendChild(d); w.appendChild(sp); box.appendChild(w);
      var st = Avatar.progress(data.state, { type: 'set', value: p }).state;
      Avatar.render(d, st, { animate: false, level: data.state.level || undefined });
      sp.textContent = Math.round(p * 100) + '%';
    });
  }

  function apply(ev, label) {
    var r = Avatar.progress(data.state, ev);
    data.state = r.state; save();
    var msg;
    if (!r.changed) msg = 'Без изменений' + (ev.type === 'level' ? '' : data.state.progress >= 1 ? ' — путь пройден до конца' : ' — событие уже засчитано');
    else msg = label + ': <b>+' + (Math.round(r.gain * 1000) / 10) + '%</b>' + (r.stageUp ? ' · новая стадия!' : '') + (r.levelUp ? ' · новое звание!' : '');
    Avatar.render(hero, data.state, { animate: true });
    info(msg);
    return r;
  }

  var names = { workout: 'Тренировка засчитана', order: 'Приказ дня закрыт', boss: 'Босс побеждён' };
  [].forEach.call(document.querySelectorAll('[data-ev]'), function (b) {
    b.addEventListener('click', function () { apply({ type: b.dataset.ev, at: now() }, names[b.dataset.ev]); });
  });
  $('nextDay').addEventListener('click', function () { data.dayOffset++; save(); info('Новый день — отдача снова полная'); });
  $('sim7').addEventListener('click', function () {
    var s0 = data.state, s = s0;
    for (var k = 0; k < 7; k++) {
      data.dayOffset++;
      s = Avatar.progress(s, { type: 'workout', at: now() }).state;
      s = Avatar.progress(s, { type: 'order', at: now() }).state;
      if ((k + 1) % 7 === 0) s = Avatar.progress(s, { type: 'streak7', at: now() }).state;
    }
    data.state = s; save();
    Avatar.render(hero, s, { animate: true });
    info('Неделя без пропусков: <b>+' + Math.round((s.progress - s0.progress) * 1000) / 10 + '%</b>');
  });
  $('reset').addEventListener('click', function () {
    var s = data.state;
    data.state = Avatar.create({ sex: s.sex, height_cm: s.height_cm, weight_kg: s.weight_kg, goal_kg: s.goal_kg, skin: s.skin });
    data.state.level = s.level; data.dayOffset = 0; save();
    Avatar.render(hero, data.state, { animate: true }); info('Сброс: путь с начала');
  });
  $('slider').addEventListener('input', function () {
    var v = +$('slider').value / 100;
    data.state = Avatar.progress(data.state, { type: 'set', value: v }).state; save();
    Avatar.render(hero, data.state, { animate: false }); info('');
  });
  $('slider').addEventListener('change', function () { Avatar.render(hero, data.state, { animate: false }); });
  $('sex').addEventListener('click', function (e) {
    var v = e.target.dataset && e.target.dataset.v; if (!v) return;
    sexV = v; [].forEach.call($('sex').children, function (b) { b.classList.toggle('on', b.dataset.v === v); });
  });
  $('lvl').addEventListener('change', function () {
    var v = $('lvl').value;
    if (v) apply({ type: 'level', level: +v }, 'Звание');
    else { data.state.level = null; save(); Avatar.render(hero, data.state, { animate: true }); info(''); }
    thumbs();
  });
  $('apply').addEventListener('click', function () {
    var lv = $('lvl').value;
    data.state = Avatar.create({ sex: sexV, height_cm: +$('h').value, weight_kg: +$('w').value, goal_kg: +$('g').value, skin: +$('skin').value });
    data.state.level = lv ? +lv : null; data.dayOffset = 0; save();
    fillForm(); Avatar.render(hero, data.state, { animate: true }); thumbs(); info('Новый боец создан');
  });

  fillForm();
  Avatar.render(hero, data.state, { animate: false });
  thumbs(); info('');
})();
</script>
</body>
</html>
